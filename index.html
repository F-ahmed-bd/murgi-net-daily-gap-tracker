<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF6">
<title>Murgi.net — M/S Shamim Traders-এর সাথে দৈনিক হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#172B4D; --blue-card:#F3F8FE; --blue-line:#C9DFF7;
    --green-card:#F3FAF5; --green-line:#D2E9D9;
    --cream:#FFF9E8; --cream-line:#F2D68A;
    --red:#C9362C; --green:#23865B; --muted:#667085;
    --white:#FFFFFF; --bg:#FDFBF6; --hair:#E7ECF3; --edge:#EEE7DA; --label-card:#F8FAFC;
    --wa:#128C7E; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--navy);
    font-family:"Noto Sans Bengali","Bangla",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.5; overflow-x:hidden; padding:0 0 40px;
  }
  .num{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 0;}

  header{background:var(--white);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;}
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.015em;line-height:1.2;
     font-family:Inter,system-ui,sans-serif;}
  .rel{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .lang{display:flex;border:1px solid var(--blue-line);border-radius:999px;overflow:hidden;flex:none;}
  .lang button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;
    padding:8px 11px;cursor:pointer;font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif;}
  .lang button.on{background:var(--navy);color:#fff;}
  .meta{margin-top:14px;}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  input[type="date"]{
    width:100%;background:var(--white);color:var(--navy);border:1px solid #DFE5EC;border-radius:12px;
    padding:12px 14px;font-size:17px;font-weight:600;min-height:48px;
    font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;
    -webkit-appearance:none;appearance:none;
  }

  /* ---------- one unified 3-column comparison grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:minmax(74px,0.92fr) 1fr 1fr;
    background:var(--white);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:14px;
  }
  .cell{
    display:flex;align-items:center;justify-content:center;
    padding:9px 7px;min-height:62px;
  }
  .cell.lb{justify-content:flex-start;padding-left:12px;font-size:13px;color:var(--muted);
    line-height:1.25;text-align:left;}
  .c-lb{background:var(--label-card);}
  .c-y{background:var(--blue-card);}
  .c-t{background:var(--green-card);}
  .hd{min-height:46px;font-size:15px;font-weight:700;color:var(--navy);padding:8px 7px;}
  .hd.lb{font-size:14px;color:var(--navy);font-weight:700;}
  .rl{border-top:1px solid var(--hair);}
  .rl-strong{border-top:1.5px solid #D8DFE9;}
  .gap-lb{font-size:14px;font-weight:700;color:var(--navy);}
  .grid input[type="text"]{
    width:100%;max-width:100%;background:var(--white);color:var(--navy);
    border:1px solid #DFE5EC;border-radius:10px;
    padding:9px 6px;font-size:15px;font-weight:600;text-align:center;min-height:44px;
    font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;
    -webkit-appearance:none;appearance:none;
  }
  .gv{font-size:16px;font-weight:700;font-family:Inter,system-ui,sans-serif;
      font-variant-numeric:tabular-nums;text-align:center;line-height:1.2;}
  input:focus-visible{outline:2px solid var(--navy);outline-offset:1px;}
  .neg{color:var(--red);} .pos{color:var(--green);} .zero{color:var(--navy);}
  .formula{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 14px;}

  @media (max-width:389px){
    .wrap{padding-left:10px;padding-right:10px;}
    .cell.lb{font-size:12px;padding-left:9px;}
    .grid input[type="text"]{font-size:14px;padding:8px 4px;}
    .gv{font-size:15px;}
    .hd{font-size:14px;}
    .grid{grid-template-columns:minmax(66px,0.86fr) 1fr 1fr;}
  }

  .result{background:var(--cream);border:1px solid var(--cream-line);border-radius:var(--radius);
    padding:18px 16px;text-align:center;margin-bottom:16px;}
  .arrow{font-size:38px;line-height:1;font-family:Inter,system-ui,sans-serif;}
  .result-text{font-size:16px;font-weight:600;margin-top:6px;}
  .result-amt{font-size:32px;font-weight:700;margin-top:4px;letter-spacing:-.02em;}

  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;
    font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif;cursor:pointer;margin-bottom:10px;min-height:52px;}
  .btn-share{background:var(--wa);color:#fff;}
  .btn-save{background:var(--white);color:var(--navy);border:1.5px solid var(--navy);}
  .btn-png{background:transparent;color:var(--muted);border:1px solid var(--hair);
    font-size:14px;min-height:44px;padding:11px;}
  .btn:active{transform:translateY(1px);}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);
    background:var(--navy);color:#fff;font-size:14px;font-weight:600;
    padding:12px 18px;border-radius:999px;max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion:reduce){#toast{transition:none;}}
  canvas{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="top-row">
      <div>
        <h1>MURGI.NET</h1>
        <div class="rel" id="t-rel">M/S Shamim Traders-এর সাথে দৈনিক হিসাব</div>
      </div>
      <div class="lang">
        <button id="btn-bn" class="on" type="button">বাংলা</button>
        <button id="btn-en" type="button">English</button>
      </div>
    </div>
    <div class="meta">
      <label class="f" id="t-date" for="date">তারিখ</label>
      <input type="date" id="date">
    </div>
  </header>

  <div class="grid">
    <div class="cell hd c-lb lb" id="t-lbhead">হিসাবের নাম</div>
    <div class="cell hd c-y" id="t-yhead">গতকাল</div>
    <div class="cell hd c-t" id="t-thead">আজ</div>

    <div class="cell lb c-lb rl"><label for="ysup" id="t-sup1">সাপ্লায়ার ডিউ</label></div>
    <div class="cell c-y rl"><input type="text" id="ysup" inputmode="numeric" autocomplete="off" aria-label="গতকালের সাপ্লায়ার ডিউ"></div>
    <div class="cell c-t rl"><input type="text" id="tsup" inputmode="numeric" autocomplete="off" aria-label="আজকের সাপ্লায়ার ডিউ"></div>

    <div class="cell lb c-lb rl"><label for="ymar" id="t-mar1">মার্কেট ডিউ</label></div>
    <div class="cell c-y rl"><input type="text" id="ymar" inputmode="numeric" autocomplete="off" aria-label="গতকালের মার্কেট ডিউ"></div>
    <div class="cell c-t rl"><input type="text" id="tmar" inputmode="numeric" autocomplete="off" aria-label="আজকের মার্কেট ডিউ"></div>

    <div class="cell lb c-lb rl-strong"><span class="gap-lb" id="t-gap1">গ্যাপ</span></div>
    <div class="cell c-y rl-strong"><div class="gv" id="ygap">0 BDT</div></div>
    <div class="cell c-t rl-strong"><div class="gv" id="tgap">0 BDT</div></div>
  </div>

  <div class="formula" id="t-formula">গ্যাপ = সাপ্লায়ার ডিউ − মার্কেট ডিউ</div>

  <section class="result">
    <div class="arrow" id="arrow">→</div>
    <div class="result-text" id="res-text">গতকালের তুলনায় গ্যাপ অপরিবর্তিত রয়েছে</div>
    <div class="result-amt num" id="res-amt"></div>
  </section>

  <button class="btn btn-share" id="share" type="button">WhatsApp-এ শেয়ার করুন</button>
  <button class="btn btn-save" id="save" type="button">হিসাব সংরক্ষণ করুন</button>
  <button class="btn btn-png" id="png" type="button">PNG ডাউনলোড করুন</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<canvas id="cv"></canvas>

<script>
(function(){
"use strict";

var SUPPLIER = "M/S Shamim Traders";
var COMPANY  = "Murgi.net";
var BRAND    = "MURGI.NET";   /* header display only */
var C = {
  navy:"#172B4D", blueCard:"#F3F8FE", blueLine:"#C9DFF7",
  greenCard:"#F3FAF5", greenLine:"#D2E9D9",
  cream:"#FFF9E8", creamLine:"#F2D68A",
  red:"#C9362C", green:"#23865B", muted:"#667085",
  white:"#FFFFFF", bg:"#FDFBF6", hair:"#E7ECF3", edge:"#EEE7DA", hairStrong:"#D8DFE9",
  labelCard:"#F8FAFC"
};

var TXT = {
  bn:{
    rel:"M/S Shamim Traders-এর সাথে দৈনিক হিসাব", date:"তারিখ",
    yhead:"গতকাল", thead:"আজ",
    sup:"সাপ্লায়ার ডিউ", mar:"মার্কেট ডিউ", gap:"গ্যাপ",
    formula:"গ্যাপ = সাপ্লায়ার ডিউ − মার্কেট ডিউ",
    save:"হিসাব সংরক্ষণ করুন", share:"WhatsApp-এ শেয়ার করুন", png:"PNG ডাউনলোড করুন",
    up:"গতকালের তুলনায় গ্যাপ বেড়েছে",
    down:"গতকালের তুলনায় গ্যাপ কমেছে",
    same:"গতকালের তুলনায় গ্যাপ অপরিবর্তিত রয়েছে",
    saved:"সংরক্ষণ হয়েছে", loaded:"সংরক্ষিত হিসাব লোড হয়েছে",
    carried:"আগের দিনের হিসাব থেকে পূরণ করা হয়েছে",
    fresh:"এই তারিখে সংরক্ষিত হিসাব নেই",
    noShare:"এই ডিভাইসে সরাসরি শেয়ার করা যাচ্ছে না",
    textOnly:"শুধু ক্যাপশন শেয়ার করা হচ্ছে",
    downloaded:"PNG সংরক্ষণ হয়েছে"
  },
  en:{
    rel:"Daily accounts with M/S Shamim Traders", date:"Date",
    yhead:"Yesterday", thead:"Today",
    sup:"সাপ্লায়ার ডিউ", mar:"মার্কেট ডিউ", gap:"গ্যাপ",
    formula:"Gap = Supplier Due − Market Due",
    save:"Save accounts", share:"Share on WhatsApp", png:"Download PNG",
    up:"Gap increased compared to yesterday",
    down:"Gap decreased compared to yesterday",
    same:"Gap unchanged compared to yesterday",
    saved:"Saved", loaded:"Loaded saved accounts",
    carried:"Filled from the previous saved day",
    fresh:"No saved accounts for this date",
    noShare:"This device cannot share directly",
    textOnly:"Sharing the caption only",
    downloaded:"PNG saved"
  }
};
var lang = "bn";
function T(){ return TXT[lang]; }

/* ---------- storage ---------- */
var mem = {};
var store = {
  get:function(k){
    try{ if(window.storage && window.storage.get){
      return window.storage.get(k).then(function(r){ return r ? JSON.parse(r.value) : null; })
             .catch(function(){ return null; });
    }}catch(e){}
    try{ var v = localStorage.getItem(k); return Promise.resolve(v ? JSON.parse(v) : null); }
    catch(e){ return Promise.resolve(k in mem ? mem[k] : null); }
  },
  set:function(k,v){
    try{ if(window.storage && window.storage.set){
      return window.storage.set(k, JSON.stringify(v)).catch(function(){ mem[k]=v; });
    }}catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); return Promise.resolve(); }
    catch(e){ mem[k]=v; return Promise.resolve(); }
  }
};
function key(iso){ return "gap:" + iso; }

/* ---------- numbers ---------- */
function digitsOnly(s){ return String(s).replace(/[^0-9]/g,""); }
function group(n){ return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function signed(n){ return (n<0?"-":"") + group(n); }
function parseVal(el){ var d = digitsOnly(el.value); return d==="" ? 0 : parseInt(d,10); }

/* ---------- dates ---------- */
function toISO(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso || iso.indexOf("-") === -1) return "";
  var p = iso.split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}
function prevISO(iso){
  var p = iso.split("-").map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate()-1);
  return toISO(d);
}

/* ---------- elements ---------- */
function $(id){ return document.getElementById(id); }
var elDate=$("date"), elYS=$("ysup"), elYM=$("ymar"), elTS=$("tsup"), elTM=$("tmar");
var elYG=$("ygap"), elTG=$("tgap"), elArrow=$("arrow"), elResT=$("res-text"), elResA=$("res-amt");

var toastTimer;
function toast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
}

function attachFormat(el){
  el.addEventListener("input", function(){
    var caret = el.selectionStart;
    var before = digitsOnly(el.value.slice(0, caret)).length;
    var d = digitsOnly(el.value);
    el.value = d === "" ? "" : group(parseInt(d,10));
    var pos=0, seen=0;
    while(pos < el.value.length && seen < before){
      if(/[0-9]/.test(el.value[pos])) seen++;
      pos++;
    }
    try{ el.setSelectionRange(pos,pos); }catch(e){}
    render();
  });
}
[elYS, elYM, elTS, elTM].forEach(attachFormat);

/* ---------- state (formulas unchanged) ---------- */
function state(){
  var ys=parseVal(elYS), ym=parseVal(elYM), ts=parseVal(elTS), tm=parseVal(elTM);
  var yg = ys - ym, tg = ts - tm;   /* Gap = Supplier Due - Market Due */
  return { ys:ys, ym:ym, ts:ts, tm:tm, ygap:yg, tgap:tg, change: tg - yg, date: elDate.value };
}
function cls(n){ return n<0 ? "neg" : (n>0 ? "pos" : "zero"); }

function render(){
  var s = state();
  elYG.textContent = signed(s.ygap) + " BDT";
  elTG.textContent = signed(s.tgap) + " BDT";
  elYG.className = "gv " + cls(s.ygap);
  elTG.className = "gv " + cls(s.tgap);
  if(s.change > 0){
    elArrow.textContent="↑"; elArrow.style.color=C.green;
    elResT.textContent=T().up; elResA.textContent=group(s.change)+" BDT"; elResA.style.color=C.green;
  } else if(s.change < 0){
    elArrow.textContent="↓"; elArrow.style.color=C.red;
    elResT.textContent=T().down; elResA.textContent=group(s.change)+" BDT"; elResA.style.color=C.red;
  } else {
    elArrow.textContent="→"; elArrow.style.color=C.navy;
    elResT.textContent=T().same; elResA.textContent="";
  }
}

function applyLang(){
  var t = T();
  document.documentElement.lang = lang;
  $("t-rel").textContent=t.rel; $("t-date").textContent=t.date;
  $("t-yhead").textContent=t.yhead; $("t-thead").textContent=t.thead;
  $("t-sup1").textContent=t.sup; $("t-mar1").textContent=t.mar; $("t-gap1").textContent=t.gap;
  $("t-formula").textContent=t.formula;
  $("save").textContent=t.save; $("share").textContent=t.share; $("png").textContent=t.png;
  $("btn-bn").classList.toggle("on", lang==="bn");
  $("btn-en").classList.toggle("on", lang==="en");
  render();
}
$("btn-bn").onclick=function(){ lang="bn"; applyLang(); store.set("gap:lang","bn"); };
$("btn-en").onclick=function(){ lang="en"; applyLang(); store.set("gap:lang","en"); };

/* ---------- load / save ---------- */
function fill(v){
  elYS.value = v.ys ? group(v.ys) : "";
  elYM.value = v.ym ? group(v.ym) : "";
  elTS.value = v.ts ? group(v.ts) : "";
  elTM.value = v.tm ? group(v.tm) : "";
  render();
}
function loadDate(iso){
  return store.get(key(iso)).then(function(rec){
    if(rec){ fill(rec); toast(T().loaded); return; }
    return store.get(key(prevISO(iso))).then(function(prev){
      if(prev){ fill({ys:prev.ts, ym:prev.tm, ts:prev.ts, tm:prev.tm}); toast(T().carried); }
      else { fill({ys:0,ym:0,ts:0,tm:0}); toast(T().fresh); }
    });
  });
}
$("save").onclick = function(){
  var s = state();
  store.set(key(s.date), {ys:s.ys, ym:s.ym, ts:s.ts, tm:s.tm}).then(function(){ toast(T().saved); });
};
elDate.addEventListener("change", function(){ loadDate(elDate.value); });

/* ---------- report image ---------- */
var BN = '"Noto Sans Bengali","Bangla",sans-serif';
var EN = 'Inter,system-ui,-apple-system,"Segoe UI",sans-serif';

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function box(ctx,x,y,w,h,r,fill,stroke){
  rr(ctx,x,y,w,h,r);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); }
}

function drawReport(){
  var s = state();
  var W = 1080, H = 806;
  var cv = $("cv");
  cv.width = W; cv.height = H;
  var ctx = cv.getContext("2d");
  ctx.textBaseline = "middle";

  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  box(ctx, 28, 28, W-56, H-56, 26, C.white, C.edge);

  var pad = 62;

  /* header — Murgi.net owns this report */
  ctx.textAlign = "center";
  ctx.fillStyle = C.navy; ctx.font = "700 52px " + EN;
  ctx.fillText(BRAND, W/2, 108);
  ctx.fillStyle = C.navy; ctx.font = "500 29px " + BN;
  ctx.fillText(SUPPLIER + "-এর সাথে দৈনিক হিসাব", W/2, 162);
  ctx.fillStyle = C.muted; ctx.font = "500 26px " + BN;
  ctx.fillText("তারিখ: " + fmtDate(s.date), W/2, 208);

  /* ONE unified 3-column comparison grid */
  var gx = pad, gw = W - pad*2;
  var gyTop = 262;
  var labelW = 300;
  var colW = (gw - labelW) / 2;
  var yColX = gx + labelW;
  var tColX = yColX + colW;
  var headH = 62, rowH = 70, nRows = 3;
  var gridH = headH + rowH*nRows;

  ctx.save();
  rr(ctx, gx, gyTop, gw, gridH, 22);
  ctx.clip();
  ctx.fillStyle = C.white; ctx.fillRect(gx, gyTop, gw, gridH);
  ctx.fillStyle = C.labelCard; ctx.fillRect(gx, gyTop, labelW, gridH);
  ctx.fillStyle = C.blueCard;  ctx.fillRect(yColX, gyTop, colW, gridH);
  ctx.fillStyle = C.greenCard; ctx.fillRect(tColX, gyTop, colW, gridH);

  /* column headers align exactly over their own columns */
  var headMid = gyTop + headH/2;
  ctx.fillStyle = C.navy; ctx.font = "700 27px " + BN;
  ctx.textAlign = "left";
  ctx.fillText("হিসাবের নাম", gx + 26, headMid + 4);
  ctx.textAlign = "center"; ctx.font = "700 28px " + BN;
  ctx.fillText("গতকাল", yColX + colW/2, headMid + 4);
  ctx.fillText("আজ",    tColX + colW/2, headMid + 4);

  var data = [
    ["সাপ্লায়ার ডিউ", group(s.ys)+" BDT", group(s.ts)+" BDT", C.navy, C.navy, false],
    ["মার্কেট ডিউ",   group(s.ym)+" BDT", group(s.tm)+" BDT", C.navy, C.navy, false],
    ["গ্যাপ",          signed(s.ygap)+" BDT", signed(s.tgap)+" BDT",
       s.ygap<0?C.red:(s.ygap>0?C.green:C.navy),
       s.tgap<0?C.red:(s.tgap>0?C.green:C.navy), true]
  ];
  var ry = gyTop + headH;
  data.forEach(function(r, i){
    var mid = ry + rowH/2;
    ctx.strokeStyle = r[5] ? C.hairStrong : C.hair;
    ctx.lineWidth = r[5] ? 2 : 1.5;
    ctx.beginPath(); ctx.moveTo(gx, ry); ctx.lineTo(gx + gw, ry); ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = r[5] ? C.navy : C.muted;
    ctx.font = (r[5] ? "700 28px " : "500 26px ") + BN;
    ctx.fillText(r[0], gx + 26, mid + 2);
    ctx.textAlign = "center";
    ctx.font = (r[5] ? "700 32px " : "600 28px ") + EN;
    ctx.fillStyle = r[3]; ctx.fillText(r[1], yColX + colW/2, mid);
    ctx.fillStyle = r[4]; ctx.fillText(r[2], tColX + colW/2, mid);
    ry += rowH;
  });
  ctx.restore();
  box(ctx, gx, gyTop, gw, gridH, 22, null, C.hair);

  /* gap change */
  var cy = gyTop + gridH + 34;
  var ch = 176;
  box(ctx, pad, cy, W - pad*2, ch, 20, C.cream, C.creamLine);
  var arrow = s.change>0 ? "↑" : (s.change<0 ? "↓" : "→");
  var color = s.change>0 ? C.green : (s.change<0 ? C.red : C.navy);
  var line  = s.change>0 ? "গতকালের তুলনায় গ্যাপ বেড়েছে"
            : (s.change<0 ? "গতকালের তুলনায় গ্যাপ কমেছে"
                          : "গতকালের তুলনায় গ্যাপ অপরিবর্তিত রয়েছে");
  ctx.textAlign = "center";
  if(s.change !== 0){
    ctx.fillStyle = color; ctx.font = "700 44px " + EN;
    ctx.fillText(arrow, W/2, cy + 44);
    ctx.fillStyle = C.navy; ctx.font = "600 27px " + BN;
    ctx.fillText(line, W/2, cy + 94);
    ctx.fillStyle = color; ctx.font = "700 48px " + EN;
    ctx.fillText(group(s.change) + " BDT", W/2, cy + 143);
  } else {
    ctx.fillStyle = color; ctx.font = "700 48px " + EN;
    ctx.fillText(arrow, W/2, cy + 62);
    ctx.fillStyle = C.navy; ctx.font = "600 28px " + BN;
    ctx.fillText(line, W/2, cy + 120);
  }

  return cv;
}

function caption(){
  var s = state();
  var last = s.change > 0
    ? "গতকালের তুলনায় " + COMPANY + " ও " + SUPPLIER + "-এর মধ্যকার Net Gap বেড়েছে " + group(s.change) + " BDT।"
    : (s.change < 0
      ? "গতকালের তুলনায় " + COMPANY + " ও " + SUPPLIER + "-এর মধ্যকার Net Gap কমেছে " + group(s.change) + " BDT।"
      : "গতকালের তুলনায় " + COMPANY + " ও " + SUPPLIER + "-এর মধ্যকার Net Gap অপরিবর্তিত রয়েছে।");
  return "📊 " + COMPANY + " — " + SUPPLIER + "\nDaily Gap Tracker\nতারিখ: " + fmtDate(s.date) + "\n\n" + last;
}

function fontsReady(){
  return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
}
function makeFile(){
  return fontsReady().then(function(){
    var cv = drawReport();
    return new Promise(function(res, rej){
      cv.toBlob(function(b){ b ? res(b) : rej(new Error("no blob")); }, "image/png");
    });
  }).then(function(blob){
    return new File([blob], "murgi-net-" + state().date + ".png", { type:"image/png" });
  });
}

/* ---------- WhatsApp share: native share sheet, never an auto-download ---------- */
$("share").onclick = function(){
  makeFile().then(function(file){
    var text = caption();
    var canFiles = !!(navigator.canShare && navigator.share) && navigator.canShare({ files:[file] });

    if(canFiles){
      return navigator.share({ files:[file], text:text }).catch(function(err){
        if(err && err.name === "AbortError") return;
        toast(T().noShare);
      });
    }
    if(navigator.share){
      toast(T().textOnly);
      return navigator.share({ text:text }).catch(function(err){
        if(err && err.name === "AbortError") return;
        toast(T().noShare);
      });
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){});
    }
    toast(T().noShare);
  }).catch(function(){ toast(T().noShare); });
};

/* explicit, user-chosen download only */
$("png").onclick = function(){
  makeFile().then(function(file){
    var url = URL.createObjectURL(file);
    var a = document.createElement("a");
    a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast(T().downloaded);
  }).catch(function(){ toast(T().noShare); });
};

/* ---------- init ---------- */
(function init(){
  var d = new Date(); d.setDate(d.getDate()-1);
  var iso = toISO(d);
  elDate.value = iso;
  store.get("gap:lang").then(function(l){
    if(l === "en" || l === "bn") lang = l;
    applyLang();
    return store.get(key(iso));
  }).then(function(rec){
    if(rec){ fill(rec); }
    else { fill({ys:3026330, ym:1487041, ts:2942230, tm:1456829}); }
  });
})();

})();
